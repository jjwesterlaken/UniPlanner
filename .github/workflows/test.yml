name: Tests

# Runs on every push and pull request. Nothing here touches your Supabase
# project or any provider account -- the database below is a throwaway
# container that exists for the length of the job.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest

    services:
      # The migration tests need a real PostgreSQL. Locally they skip when
      # there isn't one, which is fine because this container means they
      # always run somewhere -- see REQUIRE_POSTGRES below, which turns that
      # skip into a failure here.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Without a health check the job can reach the tests before the
        # server accepts connections, which would look like a broken test
        # rather than a race.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Set together, these say "a server is already running, connect to
      # it" -- psql reads all four itself.
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      # Makes every "skipped: no postgres" path exit 1 instead. A test that
      # quietly stops running is worse than no test, so CI refuses to pass
      # on one.
      REQUIRE_POSTGRES: "1"
      # Same arrangement for the differential render in
      # test-blocks-neutral.mjs, which builds the previous commit's
      # bundle and compares the rendered HTML against this one's. It
      # skips without git history; here it must not.
      REQUIRE_BASELINE: "1"

    steps:
      - name: Get the code
        uses: actions/checkout@v4
        with:
          # The differential render needs the parent commit to build, and
          # the default shallow checkout has no parent. Without this the
          # test skips in the one place skipping matters.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Check the postgres client is present
        # The migration tests need psql to talk to the service container.
        # It's part of the ubuntu-latest image, but if that ever changes,
        # fail here with the reason rather than inside a test.
        run: |
          if ! command -v psql >/dev/null; then
            echo "ERROR: psql not found on the runner, so the migration tests cannot connect."
            echo "Add a step installing postgresql-client before this one."
            exit 1
          fi
          psql --version

      # Builds the web bundle, then runs the app tests and the migration
      # tests. REQUIRE_POSTGRES (above) means the migration half can't
      # silently skip.
      - name: Run the tests
        run: npm test

  e2e:
    name: e2e journeys
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Build the web bundle
        # The journeys run the BUILT app — the same bytes a deploy ships.
        run: npm run build:web

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the three journeys
        # Against the live Supabase project with a dedicated test account
        # (see e2e/helpers.mjs for why its data cannot accumulate).
        # REQUIRE_E2E turns "no credentials" from a skip into a failure,
        # the same arrangement as REQUIRE_POSTGRES above: a journey that
        # quietly stops running is how the next eleven-day bug ships.
        env:
          REQUIRE_E2E: "1"
          TEST_ACCOUNT_EMAIL: ${{ secrets.TEST_ACCOUNT_EMAIL }}
          TEST_ACCOUNT_PASSWORD: ${{ secrets.TEST_ACCOUNT_PASSWORD }}
        run: npm run test:e2e

      - name: Keep the evidence of a failure
        # Screenshots and traces exist only for failed tests
        # (retain-on-failure), so this uploads nothing on a green run.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-evidence
          path: e2e/test-results/
          retention-days: 14

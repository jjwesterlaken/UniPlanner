name: Tests

# Runs on every push and pull request. Nothing here touches your Supabase
# project or any provider account -- the database below is a throwaway
# container that exists for the length of the job.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest

    services:
      # The migration tests need a real PostgreSQL. Locally they skip when
      # there isn't one, which is fine because this container means they
      # always run somewhere -- see REQUIRE_POSTGRES below, which turns that
      # skip into a failure here.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Without a health check the job can reach the tests before the
        # server accepts connections, which would look like a broken test
        # rather than a race.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Set together, these say "a server is already running, connect to
      # it" -- psql reads all four itself.
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      # Makes every "skipped: no postgres" path exit 1 instead. A test that
      # quietly stops running is worse than no test, so CI refuses to pass
      # on one.
      REQUIRE_POSTGRES: "1"
      # Same arrangement for the COVERAGE RATCHET, which reads
      # origin/main's copy of .c8rc.json to prove the threshold was
      # not lowered. It skips without git history; here it must not.
      # (Both git-baseline differentials have since retired — see the
      # note in test-dark-mode.mjs — but the ratchet needs the same
      # flag and the same fetch-depth.)
      REQUIRE_BASELINE: "1"

    steps:
      - name: Get the code
        uses: actions/checkout@v4
        with:
          # The coverage ratchet reads origin/main's .c8rc.json, and the
          # default shallow checkout does not fetch it. Without this the
          # check skips in the one place skipping matters.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Check the postgres client is present
        # The migration tests need psql to talk to the service container.
        # It's part of the ubuntu-latest image, but if that ever changes,
        # fail here with the reason rather than inside a test.
        run: |
          if ! command -v psql >/dev/null; then
            echo "ERROR: psql not found on the runner, so the migration tests cannot connect."
            echo "Add a step installing postgresql-client before this one."
            exit 1
          fi
          psql --version

      # Builds the web bundle, then runs the app tests and the migration
      # tests under c8. REQUIRE_POSTGRES (above) means the migration half
      # can't silently skip, and --check-coverage enforces the branch
      # threshold in .c8rc.json — today's measured figure rounded down,
      # ratcheted up-only by a test that compares against origin/main's
      # copy. Locally `npm test` stays ungated: a machine without
      # postgres legitimately exercises fewer branches, and a gate that
      # fails for that reason teaches people to ignore it.
      - name: Run the tests
        run: npm run test:coverage

      - name: Audit dependencies
        # THE POLICY, so nobody has to re-derive it: HIGH and CRITICAL
        # advisories block, moderate and low do not. Moderate advisories
        # in dev tooling are perpetual noise, and a gate that cries wolf
        # gets disabled — the 95%-coverage lesson. All dependencies are
        # audited (not just prod): the bundle ships what esbuild pulls
        # in, but the build machine runs everything else, and a
        # compromised dev dependency writes the bundle. Baseline at the
        # gate's landing: 0 vulnerabilities.
        run: npm audit --audit-level=high

  e2e:
    name: e2e journeys
    runs-on: ubuntu-latest
    # ONE shared test account means two runs must never overlap. Seen
    # live on the first secreted run: the same commit triggers both a
    # push run and a pull_request run, and the twin's account reset
    # deleted the archive row while this run was polling for it. Queue
    # behind any other e2e run, never cancel one mid-journey.
    concurrency:
      group: e2e-shared-test-account
      cancel-in-progress: false
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Build the web bundle
        # The journeys run the BUILT app — the same bytes a deploy ships.
        run: npm run build:web

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: What the built page actually computes
        # Runs HERE rather than in the npm test job, because this is the
        # job that has a browser. REQUIRE_BROWSER turns "no Chromium"
        # from a skip into a failure, the same arrangement as
        # REQUIRE_POSTGRES and REQUIRE_E2E: a check that quietly stops
        # running is how the next artifact-vs-source bug ships.
        #
        # It needs no credentials — it loads dist-web from the file
        # system — so it runs before the journeys and fails fast.
        env:
          REQUIRE_BROWSER: "1"
        run: node scripts/test-computed-ground.mjs

      - name: Run the three journeys
        # Against the live Supabase project with a dedicated test account
        # (see e2e/helpers.mjs for why its data cannot accumulate).
        # REQUIRE_E2E turns "no credentials" from a skip into a failure,
        # the same arrangement as REQUIRE_POSTGRES above: a journey that
        # quietly stops running is how the next eleven-day bug ships.
        env:
          REQUIRE_E2E: "1"
          TEST_ACCOUNT_EMAIL: ${{ secrets.TEST_ACCOUNT_EMAIL }}
          TEST_ACCOUNT_PASSWORD: ${{ secrets.TEST_ACCOUNT_PASSWORD }}
        run: npm run test:e2e

      - name: Keep the evidence of a failure
        # Screenshots and traces exist only for failed tests
        # (retain-on-failure), so this uploads nothing on a green run.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-evidence
          path: e2e/test-results/
          retention-days: 14

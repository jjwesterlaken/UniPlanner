name: Build apps

# Two ways to run this:
#   1. Manually  - Actions tab -> "Build apps" -> "Run workflow" button
#   2. On a tag  - publishing a release tagged v1.0.1 builds and attaches the files
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one platform failing shouldn't cancel the others
      matrix:
        include:
          - os: macos-latest
            label: Mac
            # "universal" = one download that works on both Apple Silicon and Intel Macs.
            # If this ever fails, replace with: --mac --arm64 --x64
            flags: --mac --universal
            artifacts: desktop/dist/*.dmg
          - os: windows-latest
            label: Windows
            flags: --win
            artifacts: desktop/dist/*.exe
          - os: ubuntu-latest
            label: Linux
            flags: --linux
            artifacts: desktop/dist/*.AppImage

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show what we're working with
        shell: bash
        run: |
          echo "node:     $(node --version)"
          echo "npm:      $(npm --version)"
          echo "NODE_ENV: '${NODE_ENV:-not set}'"
          echo "--- files checked out ---"
          ls -la
          echo "--- src ---"
          ls -la src

      - name: Install web build tools
        run: npm install

      - name: Confirm build tools installed
        shell: bash
        run: |
          test -d node_modules/esbuild || { echo "ERROR: esbuild missing"; exit 1; }
          test -d node_modules/tailwindcss || { echo "ERROR: tailwindcss missing"; exit 1; }
          echo "build tools present"

      - name: Build the planner
        run: npm run build

      - name: Install desktop build tools
        working-directory: desktop
        run: npm install

      - name: Package the desktop app
        working-directory: desktop
        run: npx electron-builder ${{ matrix.flags }} --publish never
        env:
          # Note: GITHUB_TOKEN is deliberately NOT set here. Its presence makes
          # electron-builder try to publish and generate auto-update metadata,
          # which fails the build. The finished files are collected by the
          # upload step below instead.
          #
          # ---- Code signing (optional, add later) -------------------------
          # Signing is what removes the "unidentified developer" / "Windows
          # protected your PC" warnings. Until these secrets exist, the build
          # still succeeds -- it just produces an unsigned app.
          #
          # Mac (needs an Apple Developer account):
          #   CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          #   CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          #   APPLE_ID: ${{ secrets.APPLE_ID }}
          #   APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          #   APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          #
          # Windows (needs a code signing certificate):
          #   CSC_LINK: ${{ secrets.WIN_CERT_PFX_BASE64 }}
          #   CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
          # -----------------------------------------------------------------
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: "true"

      - name: Collect the finished files
        uses: actions/upload-artifact@v4
        with:
          name: University-Planner-${{ matrix.label }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # Only runs when a version tag was pushed, not on manual runs.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download everything the build jobs produced
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List what we got
        run: find artifacts -type f | sort

      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "University Planner ${GITHUB_REF_NAME}" \
            --notes "Download the file for your device and open it. On first launch your computer may warn that the app is from an unidentified developer - see the README for the one-time steps to allow it." \
            --generate-notes=false \
            $(find artifacts -type f) \
          || gh release upload "${GITHUB_REF_NAME}" $(find artifacts -type f) --repo "${GITHUB_REPOSITORY}" --clobber

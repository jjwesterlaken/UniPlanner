name: Build apps

# Two ways to run this:
#   1. Manually  - Actions tab -> "Build apps" -> "Run workflow" button
#   2. On a tag  - publishing a release tagged v1.0.1 builds and attaches the files
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one platform failing shouldn't cancel the others
      matrix:
        include:
          - os: macos-latest
            label: Mac
            # "universal" = one download that works on both Apple Silicon and Intel Macs.
            # If this ever fails, replace with: --mac --arm64 --x64
            flags: --mac --universal
            artifacts: |
              desktop/dist/*.dmg
              desktop/dist/*.zip
              desktop/dist/latest-mac.yml
          - os: windows-latest
            label: Windows
            flags: --win
            artifacts: |
              desktop/dist/*.exe
              desktop/dist/latest.yml
          - os: ubuntu-latest
            label: Linux
            flags: --linux
            artifacts: |
              desktop/dist/*.AppImage
              desktop/dist/latest-linux.yml

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show what we're working with
        shell: bash
        run: |
          echo "node:     $(node --version)"
          echo "npm:      $(npm --version)"
          echo "NODE_ENV: '${NODE_ENV:-not set}'"
          echo "--- files checked out ---"
          ls -la
          echo "--- src ---"
          ls -la src

      - name: Install web build tools
        run: npm install

      - name: Confirm build tools installed
        shell: bash
        run: |
          test -d node_modules/esbuild || { echo "ERROR: esbuild missing"; exit 1; }
          test -d node_modules/tailwindcss || { echo "ERROR: tailwindcss missing"; exit 1; }
          echo "build tools present"

      - name: Build the planner
        run: npm run build

      - name: Install desktop build tools
        working-directory: desktop
        run: npm install

      # ---- Developer ID signing, MAC ONLY --------------------------------
      #
      # WE OWN THE KEYCHAIN, and that is the whole point of this step.
      #
      # electron-builder will happily do this itself from CSC_LINK and
      # CSC_KEY_PASSWORD: it creates a temporary keychain, imports the
      # certificate, and runs `security set-key-partition-list` to let
      # codesign use the private key without a UI prompt. On the macOS 26
      # runner (os=25.6.0) that last call fails with
      #
      #   SecKeychainUnlock: The user name or passphrase you entered is
      #   not correct.
      #
      # The certificate is fine — the import succeeds. What fails is
      # electron-builder's own handling of the keychain IT created, so no
      # secret we hold can fix it and nothing in this repository can test
      # it. Doing the four `security` calls ourselves, with a password we
      # generated, removes the dependency on that code path entirely.
      #
      # THE ALTERNATIVE WAS `runs-on: macos-15`, AND IT WAS REJECTED.
      # Pinning would work today and it avoids the runner where the bug
      # lives rather than removing the reliance on the broken path — so
      # the same failure returns when macos-15 is retired, which is to say
      # on GitHub's timetable, in whatever release someone is shipping
      # that week. It is still the one-line fallback if this step turns
      # out to be wrong: pin the Mac matrix entry to macos-15 and delete
      # this step. What would send us there is this step failing at
      # `security import` or `find-identity` on a runner where
      # electron-builder's own version is known to work.
      #
      # AND IT BUYS THE CHECK BELOW. `find-identity` runs here, before the
      # ~20-minute package-and-notarise step, so a certificate that did
      # not arrive fails in seconds and says which of the two secrets to
      # look at — instead of failing inside electron-builder's signing
      # stage with a message about a keychain nobody created.
      - name: Put the Developer ID certificate in a keychain we control
        if: matrix.label == 'Mac'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${CSC_LINK:-}" ] || [ -z "${CSC_KEY_PASSWORD:-}" ]; then
            echo "FAIL: CSC_LINK and/or CSC_KEY_PASSWORD is empty."
            echo "      Both are repository secrets. An empty one is not an"
            echo "      error to electron-builder — it reads it as 'no"
            echo "      certificate' and produces an unsigned app, which is"
            echo "      why this refuses here instead."
            exit 1
          fi

          keychain="$RUNNER_TEMP/signing.keychain-db"
          cert="$RUNNER_TEMP/certificate.p12"
          # Ours, generated here, used nowhere else, thrown away at the end
          # of the job. The point is not that it is secret — it is that we
          # KNOW it, which is exactly what electron-builder does not.
          password="$(openssl rand -base64 24)"

          # `-A` needs the input on one line; a secret pasted with wrapping
          # would otherwise decode to a truncated file that then fails at
          # import with a misleading MAC-verification error.
          printf '%s' "$CSC_LINK" | tr -d '\n\r' | openssl base64 -d -A > "$cert"
          if [ ! -s "$cert" ]; then
            echo "FAIL: CSC_LINK did not decode to anything."
            echo "      It must be the .p12 file, base64-encoded."
            exit 1
          fi

          security create-keychain -p "$password" "$keychain"
          # No lock timeout and no lock on sleep: the default 5-minute idle
          # lock expires during notarisation, and a locked keychain mid-job
          # reproduces the exact error this step exists to remove.
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          # -T names the tools allowed to use the private key without a
          # prompt. There is no interactive session to answer one, so a
          # missing entry here is a hang, not a refusal.
          security import "$cert" -k "$keychain" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12

          # The call that fails inside electron-builder. It needs the
          # keychain's password, which is the one thing a temporary
          # keychain created by someone else does not hand you.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null

          # Put it on the search list as well. codesign is given the
          # keychain explicitly via CSC_KEYCHAIN, but the notarisation and
          # stapling tools are not, and a keychain off the search list is
          # invisible to them.
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | sed -e 's/[\"]//g')

          rm -f "$cert"

          # THE VERIFICATION, and it is the reason this step is worth its
          # length. Everything above can succeed while leaving codesign
          # with nothing usable — a certificate with no private key, an
          # Apple Development certificate where a Developer ID one was
          # meant, an expired one. `find-identity -p codesigning` lists
          # only identities that can actually sign, so this is the first
          # point in the job where "the certificate arrived" stops being
          # an assumption.
          echo "--- codesigning identities in our keychain ---"
          identities="$(security find-identity -v -p codesigning "$keychain" || true)"
          echo "$identities"

          developer_id="$(grep -c 'Developer ID Application' <<<"$identities" || true)"
          if [ "$developer_id" -eq 0 ]; then
            echo
            echo "FAIL: no 'Developer ID Application' identity in the keychain."
            echo "      The import reported success, so something arrived — but"
            echo "      it cannot sign a distributable app. The usual causes:"
            echo "        * the .p12 holds the certificate WITHOUT its private key"
            echo "        * it is an 'Apple Development' or 'Apple Distribution'"
            echo "          certificate, neither of which Gatekeeper accepts for"
            echo "          a download outside the App Store"
            echo "        * the certificate has expired"
            exit 1
          fi
          if [ "$developer_id" -gt 1 ]; then
            echo
            echo "FAIL: $developer_id Developer ID Application identities."
            echo "      Refusing rather than guessing: electron-builder would"
            echo "      pick one, and which one it picked would be invisible"
            echo "      until a student's Mac rejected the download. Name the"
            echo "      intended one explicitly by setting CSC_NAME below."
            exit 1
          fi

          # THE PREFIX MUST NOT TRAVEL WITH THE NAME, and this cost a run.
          # find-identity prints the full common name — Developer ID
          # Application: Some Person (TEAMID) — and electron-builder
          # REFUSES that as CSC_NAME:
          #
          #   Please remove prefix "Developer ID Application:" from the
          #   specified name — appropriate certificate will be chosen
          #   automatically.
          #
          # It wants the person and team id alone and picks the
          # certificate type itself. So the capture starts AFTER the
          # colon. A test runs this very line against a find-identity
          # fixture and requires the prefix to be gone, because the only
          # way to know what a sed expression extracts is to run it.
          name="$(sed -n 's/.*"Developer ID Application: *\([^"]*\)".*/\1/p' <<<"$identities" | head -1)"
          if [ -z "$name" ]; then
            echo "FAIL: could not read the identity name out of find-identity."
            exit 1
          fi
          echo "signing identity: $name"

          # CSC_KEYCHAIN is read by electron-builder ONLY WHEN CSC_LINK IS
          # ABSENT — with both set it ignores the keychain and does its own
          # import again, which is the failure this step exists to avoid.
          # So the packaging step below deliberately does not receive
          # CSC_LINK or CSC_KEY_PASSWORD at all.
          #
          # CSC_NAME pins the identity to the one verified above, rather
          # than leaving auto-discovery to find whatever is on the machine.
          {
            echo "CSC_KEYCHAIN=$keychain"
            echo "CSC_NAME=$name"
          } >> "$GITHUB_ENV"
      # -------------------------------------------------------------------

      - name: Package the desktop app
        working-directory: desktop
        run: npx electron-builder ${{ matrix.flags }} --publish never
        env:
          # Note: GITHUB_TOKEN is deliberately NOT set here. Its presence makes
          # electron-builder try to publish and generate auto-update metadata,
          # which fails the build. The finished files are collected by the
          # upload step below instead.
          #
          # ---- Developer ID signing and notarisation, MAC ONLY ------------
          #
          # CSC_LINK AND CSC_KEY_PASSWORD ARE DELIBERATELY ABSENT HERE.
          # The certificate is already in a keychain the step above created,
          # and electron-builder reads CSC_KEYCHAIN (exported from that step
          # through GITHUB_ENV, alongside CSC_NAME) ONLY WHEN CSC_LINK IS
          # NOT SET. Setting them here would send it back through its own
          # temporary-keychain code, which is what fails on the macOS 26
          # runner — see the step above for the error and the reasoning.
          #
          # There is a second reason not to reintroduce them, and it
          # predates the keychain problem: CSC_LINK and CSC_KEY_PASSWORD
          # are NOT Mac-specific names. electron-builder reads the same two
          # on Windows, where they mean a .pfx authenticode certificate, so
          # setting them on this step — which every platform runs — hands
          # the Windows job an Apple .p12 and asks it to sign with it. They
          # now appear only inside a step gated on the Mac job, which is
          # what a test asserts.
          #
          # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID are what
          # `mac.notarize: true` in desktop/package.json uses. An app-specific
          # password, not the Apple account password — the account password is
          # refused by the notary service. The empty string is what a non-Mac
          # job gets, which electron-builder treats as absent.
          #
          # THE OTHER HALF OF THIS LIVES IN desktop/package.json AND USED TO
          # CANCEL IT: `mac.identity: null` means "do not sign", and it
          # overrides a perfectly good certificate silently. It is gone, and
          # a test asserts it stays gone — secrets that reach a build which
          # has been told not to sign produce an unsigned app and a green
          # tick.
          APPLE_ID: ${{ matrix.label == 'Mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.label == 'Mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.label == 'Mac' && secrets.APPLE_TEAM_ID || '' }}
          #
          # Windows signing is NOT arranged. When it is, it needs its own
          # certificate in its own secret — do not widen the two named above,
          # for the reason in that paragraph. The site carries a note about
          # the SmartScreen warning until then (FLAGS.windowsUnsignedNote).
          # -----------------------------------------------------------------
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: "true"

      # ---- Notarise the DISK IMAGE, not just the app inside it ----------
      #
      # `mac.notarize: true` notarises and staples the .app, and then the
      # dmg target packages that stapled app into a NEW file Apple has
      # never seen. The disk image therefore carries no ticket of its
      # own, which v1.1.3 proved on the artifact:
      #
      #   University Planner.dmg does not have a ticket stapled to it.
      #
      # THAT IS THE FILE A STUDENT DOWNLOADS, so it is the file that gets
      # the quarantine flag and the file Gatekeeper assesses when they
      # double-click it. The app being notarised does not answer for the
      # container: a ticket is keyed to the thing that was submitted.
      #
      # So the dmg is submitted here and stapled. Stapling is what makes
      # it work OFFLINE — a Mac with no connection cannot ask Apple, and
      # a stapled ticket is the only evidence it has locally. That is the
      # machine a student opens it on.
      - name: Notarise and staple the disk image
        if: matrix.label == 'Mac'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          dmg="$(find desktop/dist -maxdepth 1 -name '*.dmg' -print -quit || true)"
          if [ -z "$dmg" ]; then
            echo "FAIL: no .dmg was produced, so there is nothing to notarise."
            ls -la desktop/dist || true
            exit 1
          fi
          echo "notarising: $dmg"

          # IDEMPOTENT. A re-run over an already-stapled image should do
          # nothing rather than spend another submission, and a step that
          # is safe to repeat is one somebody can retry without thinking.
          if xcrun stapler validate "$dmg" >/dev/null 2>&1; then
            echo "already stapled — nothing to do"
            exit 0
          fi

          submission="$(mktemp)"
          # `--wait` blocks until Apple finishes. It does NOT reliably
          # exit non-zero on a rejection, so the status is read out of the
          # output rather than inferred from the exit code — the readback
          # rule: the command reporting success is not the same claim as
          # the submission being accepted.
          if ! xcrun notarytool submit "$dmg" \
                 --apple-id "$APPLE_ID" \
                 --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                 --team-id "$APPLE_TEAM_ID" \
                 --wait --timeout 30m 2>&1 | tee "$submission"; then
            echo "FAIL: the notary submission could not be completed."
          fi

          id="$(sed -n 's/^ *id: *\([0-9a-fA-F-]\{36\}\) *$/\1/p' "$submission" | head -1)"
          status="$(sed -n 's/^ *status: *\(.*[^ ]\) *$/\1/p' "$submission" | tail -1)"
          echo "submission id: ${id:-none} status: ${status:-unknown}"

          if [ "$status" != "Accepted" ]; then
            echo
            echo "FAIL: Apple did not accept the disk image (status: ${status:-unknown})."
            # THE REASON, not just the refusal. Without this the next
            # round is blind and costs another tag.
            if [ -n "$id" ]; then
              echo "--- notary log ---"
              xcrun notarytool log "$id" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" 2>&1 || true
            else
              echo "      No submission id was returned, so there is no log to fetch."
            fi
            exit 1
          fi

          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          echo "the disk image is notarised and stapled"
      # -------------------------------------------------------------------

      - name: Gatekeeper must accept the notarised app
        if: matrix.label == 'Mac'
        shell: bash
        run: |
          set -euo pipefail

          # THE ONLY CHECK IN THIS REPOSITORY THAT READS THE THING A STUDENT
          # WOULD DOUBLE-CLICK. Everything else about signing is configuration
          # asserting what it intends; this runs Gatekeeper's own assessment
          # against the built bundle and fails the job when it refuses.
          #
          # EVERY PROBE RUNS, AND THE STEP FAILS AT THE END. v1.1.3 is why:
          # the disk image's `stapler validate` exited 65 under `set -e` and
          # took the step with it, so the disk image's Gatekeeper assessment
          # — the line that answers what a student's Mac would do — NEVER
          # RAN, on the one run where its answer mattered. A gate that stops
          # at the first failure reports the first failure and hides the rest;
          # the log has to carry every verdict, because each round costs a
          # tag.

          failures=0
          problems=""
          # Plain strings and a counter rather than an array: /bin/bash on a
          # macOS runner is 3.2, where "${arr[@]}" on an empty array is an
          # unbound-variable error under `set -u`.
          note() {
            echo "FAIL: $1"
            problems="$problems
            - $1"
            failures=$((failures + 1))
          }

          app="$(find desktop/dist -maxdepth 2 -name '*.app' -print -quit || true)"
          # NON-VACUITY FIRST: assessing nothing passes every check below.
          if [ -z "$app" ]; then
            echo "FAIL: no .app under desktop/dist — there is nothing to assess,"
            echo "      so a pass here would have meant nothing."
            ls -la desktop/dist || true
            exit 1
          fi
          echo "assessing: $app"

          # 1. Is it signed, and is the signature internally consistent?
          if codesign --verify --deep --strict --verbose=2 "$app" 2>&1; then
            echo "app: signature valid"
          else
            note "the app is not validly signed. If this says 'code object is not signed at all', the certificate never reached the build: check CSC_LINK and CSC_KEY_PASSWORD are set as repository secrets, and that desktop/package.json has not regrown mac.identity: null."
          fi

          # 2. Is the notarisation ticket stapled to the bundle? Without it a
          #    Mac that is offline, or behind a captive portal, cannot confirm
          #    the notarisation and refuses the app — which is exactly the
          #    machine a student opens it on.
          if xcrun stapler validate "$app" 2>&1; then
            echo "app: notarisation ticket stapled"
          else
            note "the app has no stapled notarisation ticket. The signature may be fine and the notary submission not. Check APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD (an app-specific password, not the account one) and APPLE_TEAM_ID, and mac.notarize in desktop/package.json."
          fi

          # 3. Gatekeeper's own verdict. spctl writes to STDERR, hence the
          #    redirect — read without it, this check sees an empty string and
          #    passes over everything.
          assessment="$(spctl --assess --type execute --verbose=4 "$app" 2>&1 || true)"
          echo "$assessment"
          if ! grep -q "accepted" <<<"$assessment"; then
            note "Gatekeeper would refuse this app."
          # ACCEPTED IS NOT ENOUGH, and this is the part worth keeping: spctl
          # accepts for several reasons, and only one of them survives being
          # downloaded by somebody else. An app can be accepted locally on the
          # machine that built it and refused on every other Mac.
          #
          # OBSERVED on the macOS 26 runner (v1.1.3): this app prints exactly
          # "accepted" and "source=Notarized Developer ID", so the string is
          # gated rather than merely reported.
          elif ! grep -q "source=Notarized Developer ID" <<<"$assessment"; then
            note "the app is accepted, but NOT as a notarised Developer ID app. That acceptance does not travel to a student's Mac."
          else
            echo "app: accepted as a notarised Developer ID app"
          fi

          # 4. And the artifact that is actually published is the .dmg, not
          #    the .app inside it — a stapled app in an unstapled disk image
          #    still fails on first open. That sentence was written before
          #    v1.1.3 and v1.1.3 produced exactly that state, because
          #    electron-builder staples the app and then packages it into a
          #    file Apple has never seen. The step above now notarises the
          #    image itself.
          dmg="$(find desktop/dist -maxdepth 1 -name '*.dmg' -print -quit || true)"
          if [ -z "$dmg" ]; then
            echo "FAIL: no .dmg was produced, so the published artifact is unchecked."
            exit 1
          fi
          echo "assessing: $dmg"

          if xcrun stapler validate "$dmg" 2>&1; then
            echo "dmg: notarisation ticket stapled"
          else
            note "the disk image has no stapled notarisation ticket, so a student with no connection cannot confirm it. The notarise step above should have attached one."
          fi

          # THE DISK IMAGE'S STRONG EVIDENCE IS THE STAPLED TICKET, NOT THIS
          # STRING, and that is a deliberate asymmetry rather than a weaker
          # check. A stapled ticket is what an OFFLINE Mac reads, so it is
          # strictly better evidence than a source line — and unlike the
          # app's, this repository has never observed what `--type open`
          # prints for a notarised disk image on this runner, because the
          # line has never executed. It is printed and required to be
          # `accepted`; gating a string nobody here has seen would be
          # guessing, and the ticket above already carries the claim.
          dmg_assessment="$(spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg" 2>&1 || true)"
          echo "$dmg_assessment"
          if ! grep -q "accepted" <<<"$dmg_assessment"; then
            note "Gatekeeper would refuse the disk image a student downloads."
          else
            echo "dmg: accepted"
          fi

          if [ "$failures" -gt 0 ]; then
            echo
            echo "$failures Gatekeeper check(s) failed:$problems"
            exit 1
          fi

          echo
          echo "Gatekeeper accepts the app and the disk image, notarised."

      - name: Collect the finished files
        uses: actions/upload-artifact@v4
        with:
          name: University-Planner-${{ matrix.label }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 30

      # The plain web version, for hosting or for testing on a tablet.
      # Only needs collecting once, so it rides along with the Linux job.
      - name: Collect the web version
        if: matrix.label == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: University-Planner-Web
          path: dist-web
          if-no-files-found: error
          retention-days: 30

      # A hosted runner is destroyed after the job, so this is tidiness
      # rather than a safeguard — but `always()` means it also runs when
      # the build FAILED, which is the case where a self-hosted runner
      # would otherwise accumulate keychains holding a signing key.
      - name: Remove the signing keychain
        if: always() && matrix.label == 'Mac'
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          echo "signing keychain removed"

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # Only runs when a version tag was pushed, not on manual runs.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download everything the build jobs produced
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Gather the files into one folder
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          echo "--- files to publish ---"
          ls -la release

      - name: Check the update files are there
        run: |
          # These tell already-installed apps that a new version exists —
          # once something in the app is asking. TODAY NOTHING IS: the
          # desktop app bundles `electron` and `electron-builder` and no
          # `electron-updater`, and desktop/main.js has no autoUpdater, so
          # these files are published and read by nobody. They are still
          # worth publishing and still worth checking, because the day the
          # updater is wired the metadata has to have been there all
          # along — an updater that finds no latest.yml for the version it
          # is upgrading FROM has nothing to compare against.
          #
          # Verified on the v1.0.1 release rather than assumed: all three
          # files are present there, so electron-builder emits them with
          # no `publish` block and `--publish never`.
          missing=0
          for f in latest.yml latest-mac.yml latest-linux.yml; do
            if [ -f "release/$f" ]; then
              echo "found  $f"
            else
              echo "MISSING $f - auto-update will not work for that platform"
              missing=1
            fi
          done
          exit 0  # a missing file is worth flagging, not worth failing the build

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "University Planner ${GITHUB_REF_NAME}" \
              --notes "Download the file for your device and open it.

          - **Mac:** the .dmg file
          - **Windows:** the Setup .exe (or the Portable .exe to run without installing)
          - **Linux:** the .AppImage

          Already have it installed? Download the new version and install it over
          the top — the desktop app does not update itself yet."
          fi

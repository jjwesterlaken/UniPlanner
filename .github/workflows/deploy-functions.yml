name: Deploy Supabase function

# Deploys every Edge Function in supabase/functions/ without needing a
# terminal. Run it from the Actions tab whenever a function changes.
on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy every Edge Function
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # DERIVED FROM THE DIRECTORY, NOT ENUMERATED. This workflow named
      # only ai-notes for as long as ai-text existed, so every ai-text
      # change reached production by a hand-deploy nobody's checklist
      # mentioned. Naming both fixed that instance and left the shape:
      # the repo grows a third function, the workflow does not, and
      # nothing goes red. billing-webhook is that third function, and
      # it is the one whose absence is silent — a student pays, no
      # event is ever delivered anywhere, and their tier never changes.
      #
      # A function is a directory under supabase/functions/ WITH AN
      # index.ts. _shared has no index.ts and is not a function; it is
      # bundled into the ones that import it.
      - name: Work out which functions exist
        id: functions
        run: |
          FNS=$(find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts \
                  | sed 's|supabase/functions/||; s|/index.ts||' | sort | tr '\n' ' ')
          if [ -z "$FNS" ]; then
            echo "ERROR: no Edge Functions found under supabase/functions/*/index.ts."
            echo "That is either a broken checkout or a moved layout; either way, deploying nothing silently is the failure this step exists to prevent."
            exit 1
          fi
          echo "functions=$FNS" >> "$GITHUB_OUTPUT"
          echo "Deploying: $FNS"
          find supabase/functions -type f | sort

      # THE PRECONDITION, made unreachable rather than documented.
      #
      # A billing constant derived from a MODELLED figure must not reach
      # students. This has already gone wrong once: a floor of 4 minutes
      # and a deeper prompt were merged into main inside a pull request
      # described as documentation-only, and the only thing standing
      # between that and real charges was nobody clicking this button.
      #
      # The mirror test could not catch it -- it compares the server
      # constant to the client constant, and both moved together. A guard
      # on a DECISION has to anchor to the decision's precondition, which
      # here is "has anyone measured it", not "do the two copies agree".
      #
      # Clearing this is deliberate work: run
      # scripts/measure-summary-depth.mjs against a real transcript, put
      # the observed number in config.ts, and delete the UNMEASURED
      # marker in the same commit that re-derives the floor.
      - name: Refuse to ship an unmeasured billing constant
        run: |
          CONFIG=supabase/functions/ai-notes/config.ts
          if grep -q "UNMEASURED" "$CONFIG"; then
            echo "ERROR: $CONFIG still marks a billing input as UNMEASURED."
            echo
            grep -n "UNMEASURED" "$CONFIG"
            echo
            echo "MINIMUM_BILLED_MINUTES and SUMMARY_MAX_TOKENS are derived from"
            echo "TYPICAL_SUMMARY_OUTPUT_TOKENS. While that is a model rather than a"
            echo "measurement, deploying charges students on a guess."
            echo
            echo "To clear it: run scripts/measure-summary-depth.mjs against a real"
            echo "transcript, put the observed value in config.ts, re-derive the floor,"
            echo "and remove the UNMEASURED marker in that same commit."
            exit 1
          fi
          echo "No unmeasured billing inputs. OK to deploy."

      # ONE FUNCTION IS DEPLOYED DIFFERENTLY, and this is the whole of
      # why the loop has a branch in it.
      #
      # billing-webhook is called by RevenueCat, which cannot mint a
      # Supabase JWT, so the platform's verify_jwt must be OFF for that
      # function and ON for the other two. It authenticates itself
      # instead — a shared header compared in constant time, and an
      # HMAC over the raw request bytes — and, because even both of
      # those could in principle be defeated, it re-reads the
      # subscriber from RevenueCat before writing anything, so the
      # worst a forged delivery achieves is a wasted API call.
      #
      # DEPLOYED WITH verify_jwt ON, EVERY DELIVERY 401s. Nothing
      # errors on our side, nothing appears in the logs beyond the
      # platform's own rejection, and the symptom is "subscriptions
      # never activate" — a paid feature that silently never arrives.
      # A wiring test in test-ai-notes.mjs asserts this flag stays.
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for fn in ${{ steps.functions.outputs.functions }}; do
            case "$fn" in
              billing-webhook)
                echo "--- $fn (no JWT verification: the caller is RevenueCat, not a signed-in student)"
                supabase functions deploy "$fn" --no-verify-jwt \
                  --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
                ;;
              *)
                echo "--- $fn"
                supabase functions deploy "$fn" \
                  --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
                ;;
            esac
          done

      - name: Done
        run: |
          echo "Deployed. Check it under Edge Functions in the Supabase dashboard."
          echo "If a call fails, Edge Functions -> Logs shows what happened."

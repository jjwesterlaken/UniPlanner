<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>University Planner</title>
    <meta name="description" content="Plan courses, assignments, readings and study cards." />

    <!-- Replaced at build time with a hash of app.js + app.css. Read by
         the app and shown in Settings, so "which build is this user on"
         has an answer without guessing. -->
    <meta name="build-id" content="__BUILD_ID__" />

    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#fafaf9" />

    <!-- iPhone / iPad home screen -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Planner" />

    <!-- The browser's own UI (form controls, scrollbars, the address
         bar on mobile) follows this. "light dark" says the page
         handles both; the pre-paint script below narrows it to the
         one actually in force. -->
    <meta name="color-scheme" content="light dark" />

    <!-- prepaint:start — DO NOT MOVE THIS BELOW THE STYLESHEET.

         The mode has to be on <html> before the first frame, or a
         dark-mode student gets a flash of the light shell. React
         cannot do it: effects run after paint. The service worker
         makes it sharper still, since the shell is served from cache
         and paints immediately.

         Synchronous, inline, and deliberately tiny. It reads the SAME
         key src/PlannerApp.jsx writes (uni-planner-mode) and falls
         back to the OS when there is no stored override, which is what
         makes "System" the default.

         Its markers are its own. prepare-native.mjs strips the
         sw-register block in <body> by ITS markers and never touches
         this one — a test asserts both facts, because the two blocks
         being independent is the only thing keeping a packaging change
         from silently taking dark mode out. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("uni-planner-mode");
          var dark =
            saved === "dark" ||
            (saved !== "light" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (e) {
          /* Private browsing can refuse localStorage. Light is the
             right answer when we cannot know. */
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <!-- prepaint:end -->

    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="app.js"></script>
    <!-- sw-register:start — stripped by scripts/prepare-native.mjs for the
         packaged shells. The markers are the contract: prepare-native
         removes everything between them, so this script can be rewritten
         freely without breaking the native build. Do not remove them. -->
    <script>
      /* Only the hosted web build gets a service worker.

         The desktop and mobile shells serve this same file from their own
         packaged copy: Electron via file:// (where workers aren't allowed
         at all) and Capacitor via capacitor://localhost on iOS or
         http://localhost on Android. That Android origin IS a secure
         context, so a worker registers there and caches the bundled
         assets -- which would mean shipping an update through app review
         and having users still run the old build, because the worker
         serves its cache from before the files on disk were replaced.
         A packaged app already updates through its store and already
         works offline, so a worker there can only cause that. */
      (function () {
        if (!("serviceWorker" in navigator)) return;
        var host = location.hostname;
        var isHostedWeb =
          location.protocol === "https:" && host !== "localhost" && host !== "127.0.0.1";

        if (!isHostedWeb) {
          // Heal any shell install that registered one before this rule
          // existed, or it would keep serving its cache indefinitely.
          navigator.serviceWorker
            .getRegistrations()
            .then(function (rs) {
              rs.forEach(function (r) {
                r.unregister();
              });
            })
            .catch(function () {});
          return;
        }

        window.addEventListener("load", function () {
          navigator.serviceWorker.register("sw.js").catch(function () {});
        });
      })();
    </script>
    <!-- sw-register:end -->
  </body>
</html>
